
<aside class="dashboard-sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">MG</span>
      <span class="logo-text">MEGAREPUESTOS</span>
    </div>
  </aside>
<div class="login-container">
    <h2>Iniciar Sesión</h2>
    
        <div>
            <label for="email">Usuario:</label>
            <input type="email" id="email" [(ngModel)]="email" name="email" required />
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" required />
        </div>

        <button type="button" (click)="login()">Entrar</button>
    
</div>

<div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
<div>
  <h2>Registro</h2>

<input type="email" [(ngModel)]="email1" placeholder="Email">
<input type="password" [(ngModel)]="password1" placeholder="Contraseña">

<button (click)="register()">Registrarse</button>

<p>{{ mensaje }}</p>
</div>
